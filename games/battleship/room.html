<!doctype html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Bataille Navale – Salle d'attente | Mini‑Games</title>
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <link rel="stylesheet" href="css/style.css"> <!-- Thème coloriel spécifique au jeu -->

    <link rel="icon" type="image/png" href="https://mini-games.ch/assets/logos/favicon.png?v=2">
    <!-- PWA -->
    <meta name="theme-color" content="#00a8ff">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="../../manifest.json">

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
        rel="stylesheet">


    <style>
        .room-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .room-id-tag {
            background: #bb86fc;
            color: #121212;
            padding: 10px 20px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 24px;
            display: inline-block;
            margin-top: 15px;
            box-shadow: 0 0 20px rgba(187, 134, 252, 0.3);
            background: linear-gradient(135deg, var(--primary), var(--primary-variant));
            box-shadow: 0 0 20px rgba(0, 168, 255, 0.3);
            color: #fff;
        }

        .player-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
        }

        .player-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 25px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .player-item.is-leader {
            border-color: var(--primary);
        }

        .player-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .player-name {
            font-weight: 700;
            font-size: 18px;
        }

        .leader-badge {
            font-size: 10px;
            background: linear-gradient(135deg, var(--primary), var(--primary-variant));
            color: #fff;
            padding: 2px 8px;
            border-radius: 4px;
            text-transform: uppercase;
            font-weight: 800;
        }

        .status-badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .status-waiting {
            background: rgba(255, 255, 255, 0.1);
            color: #888;
        }

        .status-ready {
            background: var(--primary);
            color: #fff;
        }

        .room-footer {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .lobby-btn {
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            border: none;
            font-family: inherit;
        }

        .btn-ready {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text);
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.2);
        }

        .btn-ready.is-ready {
            background: var(--primary) !important;
            color: #fff !important;
            box-shadow: 0 4px 15px rgba(0, 168, 255, 0.4) !important;
        }

        .status-badge.ready {
            background-color: rgba(0, 168, 255, 0.1) !important;
            color: var(--primary) !important;
        }

        .btn-start {
            background: var(--secondary);
            color: #121212;
        }
    </style>
</head>

<body>
    <div id="offline-banner" class="offline-banner" style="display: none;">
        <span class="material-symbols-rounded">wifi_off</span>
        Mode hors ligne
    </div>

    <div class="bg-animation">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <div class="container" style="max-width: 500px;">
        <div class="header">
            <div class="logo">
                <div class="logo-icon">🚢</div>
                <h1>Bataille Navale</h1>
            </div>
        </div>

        <div class="config-container">
            <div class="config-card">
                <div class="room-header">
                    <h2>Salle d'attente</h2>
                    <p>Partagez ce code avec votre ami :</p>
                    <div id="roomIDDisplay" class="room-id-tag">------</div>
                </div>

                <div id="playerList" class="player-list">
                    <!-- Dynamically populated -->
                </div>

                <div class="room-footer">
                    <button id="readyBtn" class="lobby-btn btn-ready">
                        <span>OUI, JE SUIS PRÊT</span>
                    </button>
                    <button id="startGameBtn" class="lobby-btn btn-start" style="display: none;">
                        <span>LANCER LE DUEL 🔥</span>
                    </button>
                    <p id="waitingMessage" style="text-align: center; color: var(--text-dim); font-size: 14px;">
                        En attente du deuxième joueur...
                    </p>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="js/room.js"></script>
    <script type="module" src="../../js/countPlayedTime.js"></script>
</body>

</html>
