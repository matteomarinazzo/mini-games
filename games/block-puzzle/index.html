<body>
  <!-- Bouton Accueil -->
  <a href="../../index.html" class="home-button">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
      <polyline points="9 22 9 12 15 12 15 22"></polyline>
    </svg>
    <span>Accueil</span>
  </a>

  <!-- Animated Background -->
  <div class="bg-animation">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <!-- Menu principal -->
  <div class="container" id="menuContainer">
    <div class="header">
      <div class="logo">
        <div class="logo-icon">🧱</div>
        <h1>Block Puzzle</h1>
      </div>
      <p class="subtitle">Assemblez les blocs pour compléter des lignes !</p>
    </div>

    <div class="config-container">
      <div class="config-card">
        <div class="config-header">
          <h2>⚙️ Configuration de la partie</h2>
          <p>Choisissez votre défi</p>
        </div>

        <div class="config-section">
          <label class="config-label">
            <span class="label-icon">🎮</span>
            <span>Mode de jeu</span>
          </label>
          <div class="radio-grid four-cols">
            <label class="radio-card">
              <input type="radio" name="gameMode" value="libre" checked />
              <div class="radio-content">
                <div class="radio-icon">♾️</div>
                <div class="radio-label">Libre</div>
                <div class="radio-description">Jouez sans limite de temps</div>
              </div>
            </label>

            <label class="radio-card">
              <input type="radio" name="gameMode" value="defi" />
              <div class="radio-content">
                <div class="radio-icon">🏆</div>
                <div class="radio-label">Défi</div>
                <div class="radio-description">Battez le score avant la fin</div>
              </div>
            </label>

            <label class="radio-card">
              <input type="radio" name="gameMode" value="confrontation" />
              <div class="radio-content">
                <div class="radio-icon">⚔️</div>
                <div class="radio-label">Duo</div>
                <div class="radio-description">Affrontez un adversaire en ligne</div>
              </div>
            </label>
          </div>
        </div>

        <div class="config-divider"></div>

        <!-- Section spécifique au mode Défi -->
        <div class="config-section" id="challengeSettings" style="display: none;">
          <label class="config-label">
            <span class="label-icon">⏱️</span>
            <span>Durée du défi</span>
          </label>
          <div class="radio-grid four-cols">
            <label class="radio-card">
              <input type="radio" name="challengeTime" value="30" />
              <div class="radio-content">
                <div class="radio-label">30s</div>
              </div>
            </label>
            <label class="radio-card">
              <input type="radio" name="challengeTime" value="60" checked />
              <div class="radio-content">
                <div class="radio-label">1m</div>
              </div>
            </label>
            <label class="radio-card">
              <input type="radio" name="challengeTime" value="300" />
              <div class="radio-content">
                <div class="radio-label">5m</div>
              </div>
            </label>
            <label class="radio-card">
              <input type="radio" name="challengeTime" value="600" />
              <div class="radio-content">
                <div class="radio-label">10m</div>
              </div>
            </label>
          </div>
        </div>

        <div class="config-divider" id="challengeDivider" style="display: none;"></div>

        <button class="start-button" id="startGameBtn">
          🎮 Commencer l'aventure
        </button>
      </div>
    </div>

    <div class="footer">
      <p>Placez les formes stratégiquement pour vider la grille !</p>
    </div>
  </div>

  <script type="module" src="js/menu.js"></script>
  <script type="module" src="../../js/countPlayedTime.js"></script>
</body>

</html>
