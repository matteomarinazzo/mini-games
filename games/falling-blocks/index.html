<!doctype html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Falling Blocks – Jeu de réflexes en solo | Mini‑Games</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="index, follow">

    <meta name="description"
        content="Jouez gratuitement à Falling Blocks sur Mini‑Games. Empile les blocs, complète les lignes et explose le score dans ce jeu de réflexes moderne !">

    <link rel="canonical" href="https://mini-games.ch/games/falling-blocks/" />

    <!-- Open Graph -->
    <meta property="og:title" content="Falling Blocks – Jeu de réflexes en solo | Mini‑Games">
    <meta property="og:description"
        content="Empile les blocs, complète les lignes et explose le score dans ce jeu de réflexes moderne !">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://mini-games.ch/games/falling-blocks/">
    <meta property="og:image" content="https://mini-games.ch/assets/logos/falling-blocks.webp">
    <meta property="og:site_name" content="Mini‑Games">
    <meta property="og:locale" content="fr_CH">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Falling Blocks – Jeu de réflexes en solo | Mini‑Games">
    <meta name="twitter:description"
        content="Empile les blocs, complète les lignes et explose le score dans ce jeu de réflexes moderne !">
    <meta name="twitter:image" content="https://mini-games.ch/assets/logos/falling-blocks.webp">

    <!-- Schema.org -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "VideoGame",
      "name": "Falling Blocks",
      "url": "https://mini-games.ch/games/falling-blocks/",
      "description": "Jeu d'adresse où tu dois empiler les blocs, compléter les lignes et viser le meilleur score.",
      "applicationCategory": "Game",
      "operatingSystem": "Any",
      "genre": ["Arcade Game", "Puzzle Game", "Classic", "Singleplayer"],
      "inLanguage": "fr",
      "publisher": {
        "@type": "Organization",
        "name": "Mini‑Games"
      }
    }
    </script>

    <link rel="stylesheet" href="css/game.css">
    <link rel="icon" type="image/png" href="https://mini-games.ch/assets/logos/favicon.png?v=2">
</head>

<body>

    <!-- HUD -->
    <div class="hud">
        <div class="hud-item score-container">
            <div class="label">SCORE</div>
            <div class="value" id="score">0</div>
        </div>

        <div class="hud-item timer-container">
            <div class="label">TEMPS</div>
            <div class="value" id="timer">00:00</div>
        </div>

        <!-- vide pour deplacer les autres infos vers la gauche -->
        <div class="hud-item">
        </div>
    </div>

    <!-- Game Area -->
    <div class="game-area">
        <div class="grid-container">
            <div id="grid" class="grid"></div>
        </div>
    </div>

    <!-- Records Button -->
    <button class="pause-btn" id="recordsBtn" style="right: 62px;" title="Records">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10" />
            <line x1="2" y1="12" x2="22" y2="12" />
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z" />
        </svg>
    </button>

    <!-- Pause Button -->
    <button class="pause-btn" id="pauseBtn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
            <rect x="6" y="4" width="4" height="16" rx="1.5" fill="currentColor" />
            <rect x="14" y="4" width="4" height="16" rx="1.5" fill="currentColor" />
        </svg>
    </button>

    <!-- 🏆 Popup Record 🏆 -->
    <div class="game-overlay" id="recordMessagePopup" style="display: none; z-index: 2000;">
        <div class="overlay-content">
            <h2>🏆 Nouveau Record !</h2>
            <p>Vous avez battu le record mondial. Laissez un message pour l'histoire :</p>
            <div class="message-input-wrapper">
                <input type="text" id="recordMsgInput" placeholder="Votre message..." maxlength="50">
                <div class="char-counter" id="recordCharCounter">0/50</div>
            </div>
            <button class="btn-primary" id="saveRecordMsgBtn">Sauvegarder</button>
        </div>
    </div>

    <!-- Game Over Overlay -->
    <div class="game-overlay" id="gameOverOverlay">
        <div class="overlay-content">
            <h2 id="endTitle">Fin de Partie !</h2>
            <div class="final-stats">
                <div class="stat">
                    <span class="stat-label">Score</span>
                    <span class="stat-value" id="finalScore">0</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Record</span>
                    <span class="stat-value" id="finalBest">0</span>
                </div>
            </div>
            <button class="btn-primary" id="retryBtn">Rejouer</button>
            <button class="btn-secondary" id="menuBtn">Menu</button>
        </div>
    </div>

    <!-- Pause Overlay -->
    <div class="game-overlay" id="pauseOverlay" style="display: none;">
        <div class="overlay-content">
            <h2>Pause</h2>
            <button class="btn-primary" id="resumeBtn">Reprendre</button>
            <button class="btn-secondary" id="restartBtn">Recommencer</button>
            <button class="btn-secondary" id="menuBtn2">Menu</button>
            <!-- Bouton on off sons et music logo SVG-->
            <button class="btn-tertiary" id="soundBtn" title="Sons">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                    stroke-linecap="round" stroke-linejoin="round" class="icon-sound">
                    <path d="M11 5L6 9H2v6h4l5 4V5z" />
                    <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07" />
                </svg>
            </button>
            <button class="btn-tertiary" id="musicBtn" title="Musique">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                    stroke-linecap="round" stroke-linejoin="round" class="icon-music">
                    <path d="M9 18V5l12-2v13" />
                    <circle cx="6" cy="18" r="3" />
                    <circle cx="18" cy="16" r="3" />
                </svg>
            </button>
        </div>
    </div>

    <!-- Records Overlay -->
    <div class="game-overlay" id="recordsOverlay">
        <div class="overlay-content records-modal">
            <button class="modal-close" id="recordsClose">✕</button>
            <h2 class="records-title">🏆 Records</h2>

            <section class="records-section">
                <h3>👤 Mon Record</h3>
                <div class="record-grid">
                    <div class="record-card">
                        <span class="rc-label">Score</span>
                        <span class="rc-value" id="recPersonalScore">0</span>
                    </div>
                </div>
            </section>

            <section class="records-section">
                <h3>🌍 Records Mondiaux</h3>
                <div class="record-grid">
                    <div class="record-card global">
                        <span class="rc-label">Best Score</span>
                        <span class="rc-value" id="recGlobalScore">0</span>
                    </div>
                </div>
                <div class="connection-status" id="recStatus">Synchronisation...</div>
            </section>
        </div>
    </div>

    <script type="module" src="./js/game.js"></script>
    <script type="module" src="../../js/countPlayedTime.js"></script>

</body>

</html>
