<!doctype html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Quatre en Ligne | Mini‑Games</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="stylesheet" href="css/game.css" />
  <link rel="icon" type="image/png" href="https://mini-games.ch/assets/logos/favicon.png?v=2">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4376256291112381"
    crossorigin="anonymous"></script>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-QYX3ZK4KB2"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-QYX3ZK4KB2');
  </script>
</head>

<body class="studio-body gs-game-body">
  <div class="hud">
    <a class="ib" href="./index.html" title="Menu" aria-label="Retour au menu"><svg viewBox="0 0 24 24">
        <polyline points="15 18 9 12 15 6" />
      </svg></a>
    <button class="ib" id="rulesBtn" type="button" title="Règles" aria-label="Règles"><svg viewBox="0 0 24 24">
        <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z" />
        <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z" />
      </svg></button>
    <b id="hudMode"></b>
    <div id="p0" class="pl"><b>Joueur 1</b></div>
    <div id="p1" class="pl"><b>Joueur 2</b></div>
    <span class="sp"></span>
    <button class="ib" id="pauseBtn" type="button" title="Pause" aria-label="Pause"><svg viewBox="0 0 24 24">
        <rect x="6" y="4" width="4" height="16" />
        <rect x="14" y="4" width="4" height="16" />
      </svg></button>
  </div>

  <div id="stage">
    <div id="turn" role="status" aria-live="polite"></div>
    <div id="wrap">
      <div id="ghostRow"><i id="ghost" hidden></i></div>
      <div id="board"></div>
    </div>

    <div class="ov" id="pauseOv" hidden>
      <div class="modal">
        <h2>Pause</h2>
        <p>La partie est conservée.</p>
        <div class="stack"><button class="btn" id="resumeBtn" type="button">Reprendre</button>
          <a class="btn sec" href="./index.html">Quitter</a>
        </div>
      </div>
    </div>

    <div class="ov" id="endOv" hidden>
      <div class="modal">
        <h2 id="endTitle"></h2>
        <div id="endScore"></div>
        <p id="endLbl"></p>
        <p id="endDraws"></p>
        <p id="endRm" role="status"></p>
        <div class="stack"><button class="btn" id="endRestart" type="button">Rejouer</button>
          <a class="btn sec" href="./index.html">Menu</a>
        </div>
      </div>
    </div>

    <div class="ov" id="rulesOv" hidden>
      <div class="modal" role="dialog" aria-labelledby="rulesTitle">
        <button class="x" id="rulesClose" type="button" aria-label="Fermer">✕</button>
        <h2 id="rulesTitle">Règles</h2>
        <div id="rulesBody"></div>
      </div>
    </div>

    <div class="ov" id="leaveOv" hidden>
      <div class="modal" role="alertdialog">
        <h2>Quitter la partie ?</h2>
        <p>Si tu quittes maintenant, la partie est abandonnée (aucun score modifié).</p>
        <div class="stack"><button class="btn" id="leaveYes" type="button">Quitter</button>
          <button class="btn sec" id="leaveNo" type="button">Rester</button>
        </div>
      </div>
    </div>

    <div class="ov" id="netOv" hidden>
      <div class="modal" role="alertdialog">
        <h2>Salon indisponible</h2>
        <p id="netMsg"></p>
        <div class="stack"><a class="btn" href="./index.html">Retour au menu</a></div>
      </div>
    </div>
  </div>

  <div id="warn" hidden></div>
  <script type="module" src="js/game.js"></script>
  <script type="module" src="../../js/countPlayedTime.js"></script>
</body>

</html>
