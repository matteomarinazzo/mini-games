<!doctype html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow" />
    <title data-i18n="minesweeper.meta.title">Démineur – Solo et Multijoueur | Mini‑Games</title>
    <link rel="icon" type="image/png" href="https://mini-games.ch/assets/logos/favicon.png?v=2">
    <link rel="stylesheet" href="css/game.css">
</head>

<body>
    <div class="scanlines"></div>

    <header class="hud">
        <!-- GAUCHE : joueurs -->
        <div class="hud-left">
            <div class="hud-player hud-me" id="hudMe">
                <span class="hud-dot"></span>
                <span class="hud-name" id="myName">MOI</span>
                <span class="hud-score" id="myScore">0</span>
            </div>
            <div class="hud-player hud-opp" id="hudOpp">
                <span class="hud-dot"></span>
                <span class="hud-name" id="oppName">ADV</span>
                <span class="hud-score" id="oppScore">0</span>
            </div>
        </div>

        <!-- CENTRE : chrono + bombes -->
        <div class="hud-center">
            <div class="timer" id="timerDisplay">00:00</div>
            <div class="hud-mines" id="hudMines" title="Bombes">
                <svg width="18" height="18" viewBox="0 0 24 24">
                    <circle cx="11" cy="14" r="7" fill="currentColor" />
                    <path d="M11 7c0-2 2-3 3.5-4" stroke="currentColor" fill="none" stroke-width="1.8"
                        stroke-linecap="round" />
                    <circle cx="17" cy="3" r="1.6" fill="#ff9800" />
                </svg>
                <span id="minesLeft">0</span>
            </div>
            <span class="hud-status" id="hudStatus" hidden></span>
        </div>

        <!-- DROITE : pause -->
        <div class="hud-right">
            <button class="icon-btn" id="pauseBtn" aria-label="Pause">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                    stroke-linecap="round">
                    <line x1="8" y1="5" x2="8" y2="19" />
                    <line x1="16" y1="5" x2="16" y2="19" />
                </svg>
            </button>
        </div>
    </header>

    <main class="game-main" id="gameMain">
        <div class="grid" id="grid"></div>
    </main>

    <!-- Mode mobile : Révéler / Drapeau -->
    <div class="mode-switch" id="modeSwitch">
        <button class="mode-opt active" id="optReveal">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                <path
                    d="M9 11.24V7.5C9 6.12 10.12 5 11.5 5S14 6.12 14 7.5v3.74c1.21-.81 2-2.18 2-3.74C16 5.01 13.99 3 11.5 3S7 5.01 7 7.5c0 1.56.79 2.93 2 3.74zm9.84 4.63l-4.54-2.26c-.17-.07-.35-.11-.54-.11H13v-6c0-.83-.67-1.5-1.5-1.5S10 6.67 10 7.5v10.74l-3.43-.72c-.08-.01-.15-.03-.24-.03-.31 0-.59.13-.79.33l-.79.8 4.94 4.94c.27.27.65.44 1.04.44h6.79c.75 0 1.33-.55 1.44-1.28l.75-5.27c.01-.07.02-.14.02-.2 0-.62-.38-1.16-.91-1.38z" />
            </svg>
            <span data-i18n="minesweeper.game.reveal_btn">Révéler</span>
        </button>
        <button class="mode-opt" id="optFlag">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                <path d="M14.4 6L14 4H5v17h2v-7h5.6l.4 2h7V6z" />
            </svg>
            <span data-i18n="minesweeper.game.flag_btn">Drapeau</span>
        </button>
    </div>

    <!-- COUNTDOWN -->
    <div class="overlay clear" id="countdownOverlay" style="display:none">
        <div class="countdown-number" id="countdownNumber">3</div>
    </div>

    <!-- CONNEXION / ATTENTE -->
    <div class="overlay" id="waitingOverlay">
        <div class="overlay-box">
            <div class="spinner"></div>
            <h2 id="waitingTitle" data-i18n="minesweeper.game.waiting_label">Connexion…</h2>
            <p class="overlay-sub" id="waitingSub" data-i18n="minesweeper.game.waiting_sub">En attente de l'adversaire
            </p>
        </div>
    </div>

    <!-- MENU / PAUSE -->
    <div class="overlay" id="pauseOverlay" style="display:none">
        <div class="overlay-box">
            <h2 data-i18n="minesweeper.game.pause_title">Pause</h2>
            <div class="btn-col">
                <button class="btn-action btn-primary" id="resumeBtn"
                    data-i18n="minesweeper.game.resume_btn">Reprendre</button>
                <button class="btn-action btn-secondary" id="restartPauseBtn"
                    data-i18n="minesweeper.game.restart_btn">Recommencer</button>
                <button class="btn-action btn-secondary" id="menuPauseBtn"
                    data-i18n="minesweeper.game.menu_btn">Menu</button>
            </div>
            <button class="pause-audio-btn active" id="soundToggle">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M11 5L6 9H2v6h4l5 4V5zM19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07" />
                </svg>
            </button>
        </div>
    </div>

    <!-- FIN DE PARTIE -->
    <div class="overlay" id="gameOverOverlay" style="display:none">
        <div class="overlay-box">
            <h2 id="endTitle">—</h2>
            <p class="overlay-sub" id="endSub"></p>
            <div class="end-stats">
                <div class="stat-row"><span data-i18n="minesweeper.game.revealedCells">Cases révélées</span><span
                        id="endMyScore" class="stat-val">0</span></div>
                <div class="stat-row" id="statOpp"><span data-i18n="minesweeper.game.opponentCells">Cases
                        adversaire</span><span id="endOppScore" class="stat-val">0</span></div>
                <div class="stat-row"><span data-i18n="minesweeper.game.time_label">Temps</span><span id="endTime"
                        class="stat-val">00:00</span></div>
                <div class="stat-row" id="statBest"><span data-i18n="minesweeper.game.best_time">Meilleur
                        temps</span><span id="endBest" class="stat-val">—</span></div>
            </div>
            <div class="btn-col">
                <button class="btn-action btn-primary" id="restartBtn"
                    data-i18n="minesweeper.game.restart_btn">Recommencer</button>
                <button class="btn-action btn-primary" id="rematchBtn"
                    data-i18n="minesweeper.game.rematch_btn">Revanche</button>
                <p class="overlay-sub" id="rematchNote"></p>
                <button class="btn-action btn-secondary" id="menuBtn"
                    data-i18n="minesweeper.game.menu_btn">Menu</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="../../js/utils/i18n.js"></script>
    <script type="module" src="js/game.js"></script>
    <script type="module" src="../../js/countPlayedTime.js"></script>
</body>

</html>
