  <!-- Script Google Adsense -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4376256291112381"
    crossorigin="anonymous"></script>

<body>
    <!-- Sprite d'icônes -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <symbol id="i-bomb" viewBox="0 0 24 24">
            <circle cx="11" cy="14" r="7" fill="currentColor" opacity=".9" />
            <path d="M11 7c0-2 2-3 3.5-4" stroke="currentColor" fill="none" stroke-width="1.6" stroke-linecap="round" />
            <circle cx="17" cy="3" r="1.5" fill="#ff9800" />
        </symbol>
        <symbol id="i-user" viewBox="0 0 24 24">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" />
            <circle cx="12" cy="7" r="4" fill="none" stroke="currentColor" stroke-width="2" />
        </symbol>
        <symbol id="i-users" viewBox="0 0 24 24">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" />
            <circle cx="9" cy="7" r="4" fill="none" stroke="currentColor" stroke-width="2" />
            <path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" />
        </symbol>
    </svg>

    <div class="scanlines"></div>

    <header class="top-bar">
        <a href="../../index.html" class="icon-btn" aria-label="Accueil">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                <polyline points="9 22 9 12 15 12 15 22" />
            </svg>
        </a>
        <div class="logo">
            <svg class="logo-icon" width="30" height="30">
                <use href="#i-bomb" />
            </svg>
            <h1 data-i18n="minesweeper.meta.game_name">DÉMINEUR</h1>
        </div>
        <div style="width:40px"></div>
    </header>

    <main class="main-content">

        <!-- MODE -->
        <section class="card">
            <h2 class="section-title" data-i18n="minesweeper.menu.mode_title">Mode de jeu</h2>
            <div class="mode-grid">
                <button class="mode-btn active" id="btnSolo">
                    <svg>
                        <use href="#i-user" />
                    </svg>
                    <span class="mode-label" data-i18n="minesweeper.menu.mode_solo">Solo</span>
                    <span class="mode-sub" data-i18n="minesweeper.menu.mode_solo_sub">Mission solitaire — battez votre
                        meilleur temps</span>
                </button>
                <button class="mode-btn" id="btnMulti">
                    <svg>
                        <use href="#i-users" />
                    </svg>
                    <span class="mode-label" data-i18n="minesweeper.menu.mode_multi">2 Joueurs</span>
                    <span class="mode-sub" data-i18n="minesweeper.menu.mode_multi_sub">Affrontement en temps réel</span>
                </button>
            </div>
        </section>

        <!-- ONGLETS MULTI -->
        <div class="multi-tabs hidden" id="multiTabs">
            <button class="tab-btn active" data-tab="create" data-i18n="minesweeper.menu.tab_create">Créer une
                salle</button>
            <button class="tab-btn" data-tab="join" data-i18n="minesweeper.menu.tab_join">Rejoindre</button>
        </div>

        <!-- NOM -->
        <section class="card">
            <div class="input-group" style="margin:0">
                <label for="playerNameInput" data-i18n="minesweeper.menu.name_label">Nom de soldat</label>
                <input type="text" id="playerNameInput" maxlength="15" autocomplete="nickname" placeholder="Ex : Ghost"
                    data-i18n-placeholder="minesweeper.menu.name_placeholder">
            </div>
        </section>

        <!-- CONFIG -->
        <section class="card" id="sectionConfig">
            <h2 class="section-title" data-i18n="minesweeper.menu.config_title">Configuration</h2>
            <span id="difficulty_label" data-i18n="minesweeper.menu.difficulty_label">Difficulté</span>
            <div class="diff-grid">
                <button class="diff-btn active" data-diff="easy"><span class="diff-name"
                        data-i18n="minesweeper.menu.diff_easy">Facile</span><span class="diff-info">9×9 · 10<svg>
                            <use href="#i-bomb" />
                        </svg></span></button>
                <button class="diff-btn" data-diff="medium"><span class="diff-name"
                        data-i18n="minesweeper.menu.diff_medium">Moyen</span><span class="diff-info">16×16 · 40<svg>
                            <use href="#i-bomb" />
                        </svg></span></button>
                <button class="diff-btn" data-diff="hard"><span class="diff-name"
                        data-i18n="minesweeper.menu.diff_hard">Difficile</span><span class="diff-info">30×16 · 99<svg>
                            <use href="#i-bomb" />
                        </svg></span></button>
                <button class="diff-btn" data-diff="extreme"><span class="diff-name"
                        data-i18n="minesweeper.menu.diff_extreme">Extrême</span><span class="diff-info">50×50 · 500<svg>
                            <use href="#i-bomb" />
                        </svg></span></button>
            </div>
            <div class="custom-toggle-row">
                <button class="custom-toggle-btn" id="customToggle"
                    data-i18n="minesweeper.menu.custom_btn">Personnaliser</button>
            </div>
            <div class="custom-panel" id="customPanel">
                <div class="custom-row">
                    <div class="custom-field"><label for="customW"
                            data-i18n="minesweeper.menu.custom_cols">Colonnes</label><input type="number" id="customW"
                            value="12" min="5" max="60" inputmode="numeric"></div>
                    <div class="custom-field"><label for="customH"
                            data-i18n="minesweeper.menu.custom_rows">Lignes</label><input type="number" id="customH"
                            value="12" min="5" max="60" inputmode="numeric"></div>
                    <div class="custom-field"><label for="customM"
                            data-i18n="minesweeper.menu.custom_mines">Bombes</label><input type="number" id="customM"
                            value="25" min="1" inputmode="numeric"></div>
                </div>
                <p class="custom-hint" id="customHint"></p>
            </div>
        </section>

        <!-- REJOINDRE -->
        <section class="card hidden" id="sectionJoin">
            <h2 class="section-title" data-i18n="minesweeper.menu.join_title">Rejoindre une partie</h2>
            <div class="input-group">
                <label for="roomCodeInput" data-i18n="minesweeper.menu.join_code_label">Code de la salle</label>
                <input type="text" id="roomCodeInput" maxlength="6" autocomplete="off" autocapitalize="characters"
                    placeholder="Ex : AB3X7Z" data-i18n-placeholder="minesweeper.menu.join_code_placeholder">
            </div>
            <button class="action-btn btn-join" id="joinRoomBtn"
                data-i18n="minesweeper.menu.join_btn">Rejoindre</button>
            <p class="status" id="joinStatus"></p>
        </section>

        <!-- CTA -->
        <div class="cta-area" id="ctaArea">
            <button class="start-btn" id="startBtn"><span id="startBtnLabel"
                    data-i18n="minesweeper.menu.start_btn">Commencer la partie</span></button>
            <p class="status" id="createStatus"></p>
        </div>
    </main>

    <!-- SALLE D'ATTENTE (overlay, comme Wiki-Challenge) -->
    <div class="overlay" id="waitingOverlay" style="display:none">
        <div class="popup">
            <h2 class="section-title" data-i18n="minesweeper.room.title">SALLE D'ATTENTE</h2>
            <p class="room-code-label" data-i18n="minesweeper.room.code_label">CODE DE LA SALLE</p>
            <div class="room-code-display">
                <span id="displayRoomCode">······</span>
                <button class="copy-btn" id="copyCodeBtn" aria-label="Copier"><svg width="16" height="16"
                        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <rect x="9" y="9" width="13" height="13" rx="2" />
                        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
                    </svg></button>
            </div>
            <p class="hint" data-i18n="minesweeper.room.share_hint">Partagez ce code à votre adversaire</p>
            <div class="config-summary" id="cfgSummary"></div>
            <div class="player-list" id="waitingPlayers"></div>
            <p class="hint" id="waitingHint"></p>
            <div id="leaderControls" style="display:none">
                <button class="start-btn" id="startGameBtn" disabled data-i18n="minesweeper.room.start_btn">LANCER LE
                    DUEL</button>
            </div>
            <p class="status" id="waitingStatus"></p>
            <button class="action-btn btn-leave" id="leaveRoomBtn"
                data-i18n="minesweeper.room.leave_btn">Quitter</button>
        </div>
    </div>

    <script src="../../js/utils/i18n.js"></script>
    <script type="module" src="js/menu.js"></script>
    <script type="module" src="../../js/countPlayedTime.js"></script>
</body>

</html>
