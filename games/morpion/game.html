<!doctype html>
<html lang="fr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Morpion – Tic Tac Toe gratuit en ligne | Mini‑Games</title>
    <meta name="robots" content="noindex, follow">
    <link rel="canonical" href="https://mini-games.ch/games/morpion/" />
    <link rel="stylesheet" href="./css/game.css" />
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>⭕</text></svg>" />
</head>

<body>
    <!-- Menu principal en haut -->
    <div id="menuOptions">
        <button id="homeBtn">Accueil</button>
        <button id="symbolBtn">← Symboles</button>
        <button id="resetBtn">↺ Rejouer</button>
        <button id="fullscreenBtn" title="Plein écran">⛶</button>
    </div>

    <!-- Conteneur principal du jeu -->
    <div class="game-container">

        <!-- Indicateur du tour actuel -->
        <div class="turn-indicator">
            <div class="player-turn active" id="player1Turn">
                <div class="player-avatar player1-avatar">
                    <span class="player-number">1</span>
                </div>
                <div class="player-info">
                    <span class="player-name">Joueur 1</span>
                    <span class="player-symbol" id="player1SymbolDisplay">❌</span>
                </div>
            </div>

            <div class="turn-label">
                <div class="turn-arrow" id="arrowTop" style="visibility:visible">↑</div>
                <span class="turn-text">Au tour de</span>
                <div class="turn-arrow" id="arrowBottom" style="visibility:hidden">↓</div>
            </div>

            <div class="player-turn" id="player2Turn">
                <div class="player-avatar player2-avatar">
                    <span class="player-number">2</span>
                </div>
                <div class="player-info">
                    <span class="player-name">Joueur 2</span>
                    <span class="player-symbol" id="player2SymbolDisplay">⭕</span>
                </div>
            </div>
        </div>

        <!-- Plateau de jeu — rempli dynamiquement par JS selon le mode -->
        <!-- Mode 3x3 / 5x5 : .game-board avec .cell -->
        <!-- Mode ultimate  : .ultimate-board avec .mini-grid/.mini-cell -->

        <!-- Stats de la partie -->
        <div class="game-stats">
            <div class="stat-item">
                <div class="stat-icon">🏆</div>
                <div class="stat-content">
                    <span class="stat-label">Victoires J1</span>
                    <span class="stat-game" id="player1Wins">0</span>
                </div>
            </div>
            <div class="stat-item">
                <div class="stat-icon">🤝</div>
                <div class="stat-content">
                    <span class="stat-label">Égalités</span>
                    <span class="stat-game" id="draws">0</span>
                </div>
            </div>
            <div class="stat-item">
                <div class="stat-icon">🏆</div>
                <div class="stat-content">
                    <span class="stat-label">Victoires J2</span>
                    <span class="stat-game" id="player2Wins">0</span>
                </div>
            </div>
        </div>

    </div><!-- .game-container -->

    <!-- Overlay popup -->
    <div id="popupOverlay" class="popup-overlay"></div>

    <!-- Popup gagnant -->
    <div id="winnerPopup" class="winner-popup">
        <div class="popup-content">
            <div class="winner-icon" id="winnerIcon">🏆</div>
            <div class="winner-message" id="winnerMessage">
                <span id="winnerText">Joueur <span id="winnerNumber">1</span> gagne !</span>
                <div class="winner-symbol" id="winnerSymbol">🎉</div>
            </div>
            <button id="popupOkBtn" class="popup-btn">Continuer →</button>
        </div>
    </div>

    <!-- Popup égalité -->
    <div id="drawPopup" class="draw-popup">
        <div class="popup-content">
            <div class="draw-icon">🤝</div>
            <div class="draw-message" id="DrawMessage">
                Match nul !
                <div class="draw-subtitle">Aucun gagnant cette fois-ci !</div>
            </div>
            <button id="drawOkBtn" class="draw-btn">Rejouer →</button>
        </div>
    </div>

    <!-- Script unifié -->
    <script type="module" src="./js/ctrl/gameCtrl.js"></script>
    <script type="module" src="./js/ui/menuInGame.js"></script>
    <script type="module" src="../../js/countPlayedTime.js"></script>
</body>

</html>
