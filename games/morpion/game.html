<!doctype html>
<html lang="fr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Morpion – Tic Tac Toe gratuit en ligne | Mini‑Games</title>
    <meta name="robots" content="noindex, follow">
    <link rel="canonical" href="https://mini-games.ch/games/morpion/" />
    <link rel="stylesheet" href="./css/game.css" />
    <link rel="icon" type="image/png" href="https://mini-games.ch/assets/logos/favicon.png?v=2">
    <!-- Script Google Adsense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4376256291112381"
        crossorigin="anonymous"></script>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-QYX3ZK4KB2"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());

        gtag('config', 'G-QYX3ZK4KB2');
    </script>
</head>

<body>
    <!-- Barre compacte : Menu (retour au menu du jeu), Accueil | Rejouer, Pause -->
    <header class="hud">
        <div class="hl">
            <a class="ib" id="menuBtn" href="./index.html" title="Menu" aria-label="Retour au menu"><svg
                    viewBox="0 0 24 24">
                    <polyline points="15 18 9 12 15 6" />
                </svg></a>
            <button class="ib" id="homeBtn" type="button" title="Accueil" aria-label="Accueil"><svg viewBox="0 0 24 24">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                    <polyline points="9 22 9 12 15 12 15 22" />
                </svg></button>
        </div>
        <div class="hr">
            <button class="ib" id="resetBtn" type="button" title="Rejouer" aria-label="Rejouer"><svg
                    viewBox="0 0 24 24">
                    <path d="M3 12a9 9 0 1 0 3-6.7" />
                    <polyline points="3 3 3 9 9 9" />
                </svg></button>
            <button class="ib" id="pauseBtn" type="button" title="Pause (Échap)" aria-label="Pause"><svg
                    viewBox="0 0 24 24">
                    <rect x="6" y="4" width="4" height="16" />
                    <rect x="14" y="4" width="4" height="16" />
                </svg></button>
        </div>
    </header>

    <!-- Conteneur principal du jeu -->
    <div class="game-container">

        <!-- Indicateur du tour actuel -->
        <div class="turn-indicator">
            <div class="player-turn active" id="player1Turn">
                <div class="player-avatar player1-avatar">
                    <span class="player-number">1</span>
                </div>
                <div class="player-info">
                    <span class="player-name">Joueur 1</span>
                    <span class="player-symbol" id="player1SymbolDisplay">❌</span>
                </div>
            </div>

            <div class="turn-label">
                <div class="turn-arrow" id="arrowTop" style="visibility:visible">↑</div>
                <span class="turn-text">Au tour de</span>
                <div class="turn-arrow" id="arrowBottom" style="visibility:hidden">↓</div>
            </div>

            <div class="player-turn" id="player2Turn">
                <div class="player-avatar player2-avatar">
                    <span class="player-number">2</span>
                </div>
                <div class="player-info">
                    <span class="player-name">Joueur 2</span>
                    <span class="player-symbol" id="player2SymbolDisplay">⭕</span>
                </div>
            </div>
        </div>

        <!-- Plateau de jeu — rempli dynamiquement par JS selon le mode -->
        <!-- Mode 3x3 / 5x5 : .game-board avec .cell -->
        <!-- Mode ultimate  : .ultimate-board avec .mini-grid/.mini-cell -->

        <!-- Stats de la partie -->
        <div class="game-stats">
            <div class="stat-item">
                <div class="stat-icon"><svg viewBox="0 0 24 24">
                        <path d="M8 4h8v5a4 4 0 0 1-8 0z" />
                        <path d="M8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M9 20h6" />
                    </svg></div>
                <div class="stat-content">
                    <span class="stat-label">Victoires J1</span>
                    <span class="stat-game" id="player1Wins">0</span>
                </div>
            </div>
            <div class="stat-item">
                <div class="stat-icon"><svg viewBox="0 0 24 24">
                        <path d="M6 9h12M6 15h12" />
                    </svg></div>
                <div class="stat-content">
                    <span class="stat-label">Égalités</span>
                    <span class="stat-game" id="draws">0</span>
                </div>
            </div>
            <div class="stat-item">
                <div class="stat-icon"><svg viewBox="0 0 24 24">
                        <path d="M8 4h8v5a4 4 0 0 1-8 0z" />
                        <path d="M8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M9 20h6" />
                    </svg></div>
                <div class="stat-content">
                    <span class="stat-label">Victoires J2</span>
                    <span class="stat-game" id="player2Wins">0</span>
                </div>
            </div>
        </div>

    </div><!-- .game-container -->

    <!-- Overlay popup -->
    <div id="popupOverlay" class="popup-overlay"></div>

    <!-- Popup gagnant -->
    <div id="winnerPopup" class="winner-popup">
        <div class="popup-content">
            <div class="winner-icon" id="winnerIcon">🏆</div>
            <div class="winner-message" id="winnerMessage">
                <span id="winnerText">Joueur <span id="winnerNumber">1</span> gagne !</span>
                <div class="winner-symbol" id="winnerSymbol">🎉</div>
            </div>
            <button id="popupOkBtn" class="btn popup-btn">Rejouer</button>
        </div>
    </div>

    <!-- Popup égalité -->
    <div id="drawPopup" class="draw-popup">
        <div class="popup-content">
            <div class="draw-icon">🤝</div>
            <div class="draw-message" id="DrawMessage">
                Match nul !
                <div class="draw-subtitle">Aucun gagnant cette fois-ci !</div>
            </div>
            <button id="drawOkBtn" class="btn draw-btn">Rejouer</button>
        </div>
    </div>

    <!-- Modale pause -->
    <div class="ov" id="pauseOv" hidden>
        <div class="modal" role="dialog" aria-labelledby="pTitle">
            <h2 id="pTitle">Pause</h2>
            <div class="stack">
                <button class="btn" id="resume" type="button">Reprendre</button>
                <button class="btn sec" id="pRestart" type="button">Recommencer</button>
                <a class="btn sec" href="./index.html">Menu</a>
            </div>
        </div>
    </div>

    <!-- Script unifié -->
    <script type="module" src="./js/ctrl/gameCtrl.js"></script>
    <script type="module" src="./js/ui/menuInGame.js"></script>
    <script type="module" src="../../js/countPlayedTime.js"></script>
</body>

</html>
