<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="robots" content="noindex, nofollow" />
    <title>Rocketeer – Vol en cours | Mini‑Games</title>
    <link rel="icon" type="image/png" href="https://mini-games.ch/assets/logos/favicon.png?v=2">
    <link rel="stylesheet" href="css/game.css">

</head>

<body>
    <canvas id="game-canvas"></canvas>
    <canvas id="map-canvas"></canvas>

    <div id="hud">
        <div class="hud-telemetry">
            <div class="hud-cell">
                <div class="hud-label">Altitude</div>
                <div class="hud-value" id="hud-alt">0 m</div>
            </div>
            <div class="hud-cell">
                <div class="hud-label">Speed</div>
                <div class="hud-value" id="hud-speed">0 m/s</div>
            </div>
            <div class="hud-cell">
                <div class="hud-label">Dist Max</div>
                <div class="hud-value" id="hud-dist">0 m</div>
            </div>
            <div class="hud-cell">
                <div class="hud-label">TWR</div>
                <div class="hud-value" id="hud-twr">0.00</div>
            </div>
            <div class="hud-cell">
                <div class="hud-label">Credits</div>
                <div class="hud-value" id="hud-money">0 ¢</div>
            </div>
            <div class="hud-cell">
                <div class="hud-label">Time</div>
                <div class="hud-value" id="hud-time">0s</div>
            </div>
        </div>

        <div class="hud-fuel-bar">
            <!-- Dynamic rows injected by JS -->
        </div>

        <div class="hud-top-right">
            <div class="hud-stage-display" id="hud-stage">Stage 1/1</div>
            <div class="hud-sas-display" id="hud-sas" onclick="Game.toggleSAS()">⬆ SAS ON</div>
        </div>

        <div id="fuel-countdown">⚠ OUT OF FUEL — End in 10s</div>
        <div id="hud-flash"></div>

        <div class="throttle-panel">
            <div class="throttle-label">THR</div>
            <div class="throttle-track" id="throttle-track" onclick="handleThrottleClick(event)">
                <div class="throttle-fill" id="throttle-fill" style="height:0%"></div>
            </div>
            <input type="range" id="throttle-slider" min="0" max="100" value="0" step="1">
            <div id="throttle-pct">0%</div>
        </div>

        <div class="control-strip">
            <div class="control-group flight">
                <button class="ctrl-btn stage-btn" id="btn-stage" onclick="Game.stageRocket()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path
                            d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z" />
                        <path
                            d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z" />
                        <path d="M9 12H4s.55-3.03 2-5c1.62-2.2 5-3 5-3" />
                        <path d="M12 15v5s3.03-.55 5-2c2.2-1.62 3-5 3-5" />
                    </svg>
                    <span>STAGE</span>
                </button>
            </div>

            <div class="control-group systems">
                <!-- btn pour recentrer à la fusée -->
                <button class="ctrl-btn" id="btn-center" onclick="Game.centerCamera()" title="Center Camera">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z" />
                        <circle cx="12" cy="12" r="3" />
                    </svg>
                    <span class="label">CENTER</span>
                </button>
            </div>

            <div class="control-group menu">
                <button class="ctrl-btn" onclick="Game.togglePause()" title="Pause Game">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="6" y="4" width="4" height="16" />
                        <rect x="14" y="4" width="4" height="16" />
                    </svg>
                </button>
                <button class="ctrl-btn" onclick="Game.toggleTimeScale()" title="Toggle Time Scale">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10" />
                        <path d="M12 6v6l4 2" />
                    </svg>
                    <span id="time-scale-label">x1</span>
                </button>
                <button class="ctrl-btn" onclick="window.location.href='index.html'" title="Abort to Builder">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M19 12H5M12 19l-7-7 7-7" />
                    </svg>
                    <span>BUILDER</span>
                </button>
                <div class="control-group time" id="time-scale-menu">
                    <div class="ts-option" data-v="0">x0</div>
                    <!--<div class="ts-option" data-v="0.5">x0.5</div>-->
                    <div class="ts-option" data-v="1">x1</div>
                    <div class="ts-option" data-v="4">x4</div>
                    <div class="ts-option" data-v="8">x8</div>
                    <div class="ts-option" data-v="15">x15</div>
                </div>
            </div>
        </div>
    </div>

    <div id="hud-flash"></div>

    <div id="pause-overlay">
        <div class="pause-card">
            <div class="pause-header">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="6" y="4" width="4" height="16" />
                    <rect x="14" y="4" width="4" height="16" />
                </svg>
                <h2>PAUSED</h2>
            </div>
            <div class="pause-btns">
                <button class="btn btn-primary" onclick="Game.togglePause()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="m5 3 14 9-14 9V3z" />
                    </svg>
                    Resume
                </button>
                <button class="btn" onclick="document.getElementById('rules-in-game').style.display='flex'">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z" />
                        <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z" />
                    </svg>
                    Flight Manual
                </button>
                <button class="btn" onclick="window.location.href='index.html'">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M19 12H5M12 19l-7-7 7-7" />
                    </svg>
                    Back to Builder
                </button>
            </div>
        </div>
    </div>

    <!-- END -->
    <div id="end-overlay">
        <div class="end-card">
            <div class="end-header">
                <div id="end-icon-svg" style="width:48px;height:48px;margin:0 auto 12px;color:var(--accent)"></div>
                <div class="end-title">Mission Status</div>
            </div>

            <div
                style="font-family:var(--mono);font-size:11px;color:var(--text-dim);letter-spacing:2px;margin-bottom:4px;text-align:center">
                MAX DISTANCE</div>
            <div class="end-distance-val" id="end-distance" style="text-align:center">0 m</div>

            <div class="end-stats">
                <div class="end-reward-row"><span>Research Grant</span><span id="end-reward">+0 ¢</span></div>
                <div class="end-reward-row" id="end-recovery-row" style="display:none">
                    <span>Ship Recovery</span>
                    <span id="end-recovery" style="color:#40c080">+0 ¢</span>
                </div>
                <div class="end-total-row"><span>Total Credits</span><span id="end-total">0 ¢</span></div>
            </div>

            <div class="end-buttons">
                <button class="btn btn-launch" onclick="Game.retryFlight()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 2v6h-6" />
                        <path d="M21 13a9 9 0 1 1-3-7.7L21 8" />
                    </svg>
                    Retry
                </button>
                <button class="btn" onclick="Game.goToBuilder()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M19 12H5M12 19l-7-7 7-7" />
                    </svg>
                    Builder
                </button>
            </div>
        </div>
    </div>

    <!-- Rules in game -->
    <div class="rules-overlay" id="rules-in-game">
        <div class="rules-modal">
            <button class="rules-close" onclick="document.getElementById('rules-in-game').style.display='none'">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    style="width:16px;height:16px">
                    <path d="M18 6 6 18M6 6l12 12" />
                </svg>
            </button>
            <div id="rules-content-target">
                <!-- Paginated content injected here -->
            </div>

            <div class="rules-footer">
                <div class="rules-pagination">
                    <button class="btn btn-sm" id="rules-prev" onclick="Rules.prevPage()">←</button>
                    <div id="rules-dots" class="rules-dots"></div>
                    <button class="btn btn-sm" id="rules-next" onclick="Rules.nextPage()">→</button>
                </div>
                <button class="btn btn-primary" onclick="document.getElementById('rules-in-game').style.display='none'"
                    style="width:100%;margin-top:12px">Back to Flight</button>
            </div>
        </div>
    </div>

    <script>
        if (!CanvasRenderingContext2D.prototype.roundRect) {
            CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
                r = Math.min(r, w / 2, h / 2); this.beginPath(); this.moveTo(x + r, y);
                this.arcTo(x + w, y, x + w, y + h, r); this.arcTo(x + w, y + h, x, y + h, r);
                this.arcTo(x, y + h, x, y, r); this.arcTo(x, y, x + w, y, r); this.closePath();
            };
        }
        function handleThrottleClick(e) {
            const rect = e.currentTarget.getBoundingClientRect();
            const pct = 1 - (e.clientY - rect.top) / rect.height;
            if (window.Game && window.Game._setThrottle) window.Game._setThrottle(pct);
        }
    </script>
    <script src="js/parts.js"></script>
    <script src="js/physics.js"></script>
    <script src="js/rocket.js"></script>
    <script src="js/renderer.js"></script>
    <script src="js/game.js"></script>
    <script type="module">
        import { playRocketeerSound } from '../../js/utils/audio.js';
        window.playRocketeerSound = playRocketeerSound;
    </script>
    <script type="module" src="../../js/countPlayedTime.js"></script>
</body>

</html>
