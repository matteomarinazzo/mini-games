<body class="sm">
    <a href="../../index.html" class="home-button">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
        <span>Accueil</span>
    </a>
    <main class="box">
        <div class="title-wrap">
            <h1>Skyjo</h1>
        </div>
        <p class="sub">Le moins de points gagne.</p>

        <input class="fld" id="name" maxlength="15" placeholder="Votre pseudo" autocomplete="nickname"
            aria-label="Pseudo" style="margin-bottom:16px;">

        <div class="tabs">
            <button class="on" id="tSolo" type="button">Solo</button>
            <button id="tMulti" type="button">Multijoueur</button>
        </div>

        <!-- Section Solo -->
        <section id="solo">
            <div class="mode-toggle">
                <span class="mode-label">Mode de jeu</span>
                <div class="mode-sw" role="radiogroup" aria-label="Mode de jeu solo">
                    <button class="mode-btn on" id="sClassic" type="button" role="radio"
                        aria-checked="true">Classique</button>
                    <button class="mode-btn" id="sCrazy" type="button" role="radio" aria-checked="false">Crazy</button>
                </div>
            </div>

            <h2 id="lbl">Nombre de joueurs</h2>
            <div class="nums" id="nums" role="radiogroup" aria-labelledby="lbl"></div>
            <button class="play" id="playBtn" type="button">Jouer</button>
        </section>

        <!-- Section Multijoueur -->
        <section id="multi" hidden>
            <div class="mode-toggle">
                <span class="mode-label">Mode pour les nouvelles rooms</span>
                <div class="mode-sw" role="radiogroup" aria-label="Mode de jeu multijoueur">
                    <button class="mode-btn on" id="mClassic" type="button" role="radio"
                        aria-checked="true">Classique</button>
                    <button class="mode-btn" id="mCrazy" type="button" role="radio" aria-checked="false">Crazy</button>
                </div>
            </div>

            <button class="play" id="createBtn" type="button">Créer une room</button>
            <p class="or">ou</p>
            <div class="jr">
                <input class="fld" id="code" maxlength="6" placeholder="CODE" autocomplete="off"
                    autocapitalize="characters" aria-label="Code de la room">
                <button class="play" id="joinBtn" type="button">Rejoindre</button>
            </div>
            <button class="play sec" id="resumeBtn" type="button" hidden>Reprendre la partie en cours</button>
            <p class="st" id="st" aria-live="polite"></p>
        </section>
    </main>

    <!-- Modal Salle d'attente Multi -->
    <div class="ov" id="wait" hidden>
        <div class="box">
            <h2>Salle d'attente</h2>
            <div class="room-mode-tag" id="wmode">Mode Classique</div>
            <div class="code" id="wcode">—</div>
            <button class="play sec" id="copyBtn" type="button" style="margin:0 0 14px">Copier le code</button>
            <div class="chips" id="chips"></div>
            <p class="hint" id="whint"></p>
            <button class="play" id="startBtn" type="button" hidden>Lancer la partie</button>
            <button class="play sec" id="leaveBtn" type="button">Quitter la room</button>
        </div>
    </div>

    <script type="module" src="js/menu.js"></script>
    <script type="module" src="../../js/countPlayedTime.js"></script>
</body>
