  <link rel="stylesheet" href="./style.css" />

</head>

<body>
  <canvas id="canvas"></canvas>

  <!-- Menu principal en haut -->
  <div id="menuOptions">
    <button id="homeBtn">Accueil</button>
    <button id="settingsBtn">⚙️ Paramètres</button>
    <button id="fullscreenBtn" , title="Plein écran">⛶</button>
  </div>

  <!-- Menu d'upgrades fixé en bas -->
  <div id="menuUpgrades">
    <button id="shovelBtn">Augmenter la pelle</button>
    <button id="coinBtn">Augmenter les gains</button>

    <button id="spawnSkierBtn">Débloquer les skieurs</button>
    <button id="spawnTimeBtn">Diminuer le temps d'attente</button>
    <button id="spawnRateBtn">Augmenter le nombre de skieurs</button>
  </div>

  <!-- Menu paramètres déroulable -->
  <div id="menuParams" style="display: none">
    <h3>Paramètres du jeu</h3>

    <label>
      Largeur du terrain :
      <input type="number" id="terrainWidth" min="800" max="20000" value="2000" />
    </label>
    <label>
      Hauteur du terrain :
      <input type="number" id="terrainHeight" min="600" max="20000" value="2000" />
    </label>
    <button id="applyTerrainSize">Appliquer</button>
    <hr />

    <label>
      Taille initiale de la pelle :
      <input type="number" id="shovelSize" min="1" max="20" value="1" />
    </label>
    <hr />

    <label>
      Vitesse des skieurs :
      <input type="number" id="skierSpeed" min="1" max="100" value="6" />
    </label>
    <hr />

    <label>
      Ratio argent / tuile :
      <input type="number" step="0.1" id="coinRatio" min="0.1" max="10000" value="0.1" />
    </label>
    <hr />

    <label>
      Temps d’attente entre spawn de skieur (s) :
      <input type="number" id="spawnTime" min="0" max="30" value="30" />
    </label>
    <hr />

    <label>
      Nombre de skieurs par clic droit :
      <input type="number" id="spawnRate" min="1" max="10" value="1" />
    </label>
    <hr />

    <label>
      <input type="checkbox" id="infiniteCoins" />
      Mode “infinite coins”
    </label>
  </div>

  <!-- Indicateurs de direction de la caméra -->
  <div id="cameraHints">
    <div class="arrow up">▲</div>
    <div class="arrow down">▼</div>
    <div class="arrow left">◀</div>
    <div class="arrow right">▶</div>
  </div>

  <!-- Infos de gauche (Stats) -->
  <div class="ui-panel left-panel">
    <div class="ui-row">
      <span class="label">🏔️ Terrain :</span>
      <span id="ui-percent" class="value">0%</span>
    </div>
    <div class="ui-row">
      <span class="label">💰 Pièces :</span>
      <span id="ui-coins" class="value gold">0</span>
    </div>
  </div>

  <!-- Infos de droite (Upgrades) -->
  <div class="ui-panel right-panel">
    <div class="ui-row">
      <span class="label">🛠️ Pelle :</span>
      <span id="ui-shovel" class="value">Niveau 1</span>
    </div>
    <div id="ui-skier-status" class="ui-status">Skieurs non débloqués</div>
  </div>

  <!-- Scripts -->
  <script type="module" src="./js/main.js"></script>
  <script type="module" src="./js/ui/menu.js"></script>
  <script type="module" src="./js/ui/menuParams.js"></script>
  <script type="module" src="../../js/countPlayedTime.js"></script>
</body>

</html>
