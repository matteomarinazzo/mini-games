<!doctype html>
<html lang="fr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Where Am I – En jeu</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/game.css" />
    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Pannellum 360° viewer -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css" />
    <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
    <link rel="icon" type="image/png" href="https://mini-games.ch/assets/logos/favicon.png?v=2">
</head>

<body class="studio-body gs-game-body">

    <!-- ── TOP HUD ── -->
    <div class="gs-top-hud" id="topHud">
        <a href="./index.html" class="gq-back-btn" title="Menu" id="backBtn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <path d="M19 12H5M5 12l7 7M5 12l7-7" />
            </svg>
        </a>
        <div class="gq-hud-center">
            <span class="gq-mode-badge" id="hudMode">Where Am I</span>
            <span class="gq-score-label">Score</span>
            <div class="gs-hud-stat">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                    class="mobile-icon">
                    <path
                        d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" />
                </svg>
                <span class="gq-score-val" id="hudScore">0</span>
            </div>
        </div>
        <div class="gs-hud-right">
            <div class="gs-round-badge" id="hudRound">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                    class="mobile-icon">
                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2" />
                    <line x1="16" y1="2" x2="16" y2="6" />
                    <line x1="8" y1="2" x2="8" y2="6" />
                    <line x1="3" y1="10" x2="21" y2="10" />
                </svg>
                <span>Manche 1/5</span>
            </div>
            <div class="gs-timer-wrap" id="timerWrap" style="display:none">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10" />
                    <polyline points="12 6 12 12 16 14" />
                </svg>
                <span id="timerDisplay">2:00</span>
            </div>
        </div>
    </div>

    <!-- ── PHOTO VIEWER ── -->
    <div class="gs-viewer-wrap" id="viewerWrap">
        <!-- 360° Pannellum viewer -->
        <div id="panoramaViewer" style="display:none; width:100%; height:100%;"></div>
        <!-- Fallback: flat photo -->
        <div id="flatPhotoWrap" style="display:none; width:100%; height:100%; position:relative;">
            <img id="flatPhoto" src="" alt="Trouve où cette photo a été prise"
                style="width:100%;height:100%;object-fit:cover;" />
            <div class="gs-flat-hint">📸 Photo statique — pas de vue 360° disponible ici</div>
        </div>
        <!-- Loading state -->
        <div class="gs-loading" id="photoLoading">
            <div class="gs-loading-spinner"></div>
            <p>Chargement de la photo…</p>
        </div>
    </div>

    <!-- ── PLAYERS BAR (multiplayer) ── -->
    <div class="gs-players-bar" id="playersBar" style="display:none"></div>

    <!-- ── MAP PANEL ── -->
    <div class="gs-map-panel" id="mapPanel" style="display:none">
        <div class="gs-map-header">
            <span>🗺️ Clique pour placer ton estimation</span>
            <button class="gs-map-close-btn" id="mapCloseBtn">✕</button>
        </div>
        <div id="leafletMap" style="width:100%;height:100%;"></div>
        <div class="gs-map-footer">
            <button class="btn btn-outline gs-reset-guess-btn" id="resetGuessBtn" style="display:none">
                ✕ Annuler
            </button>
            <button class="btn btn-primary gs-confirm-btn" id="confirmGuessBtn" disabled>
                ✅ Valider ma réponse
            </button>
        </div>
    </div>

    <!-- ── MAP TOGGLE BUTTON ── -->
    <button class="gs-map-toggle" id="mapToggleBtn">
        🗺️ Carte
    </button>

    <!-- ── ROUND RESULT OVERLAY ── -->
    <div class="overlay" id="roundResultOverlay" style="display:none">
        <div class="popup gs-result-popup">
            <div class="gs-result-header">
                <span id="resultEmoji">🎯</span>
                <h2 id="resultTitle">Bonne localisation !</h2>
            </div>
            <div class="gs-result-distance">
                <span id="resultDistance">—</span>
                <small>km de distance</small>
            </div>
            <div class="gs-result-points">
                <span id="resultPoints">0</span>
                <small>points gagnés</small>
            </div>
            <!-- Mini result map -->
            <div id="resultMap" style="width:100%;height:220px;border-radius:12px;overflow:hidden;margin:16px 0;"></div>
            <!-- Multiplayer scores -->
            <div id="roundScores" class="gs-round-scores" style="display:none"></div>
            <button class="btn btn-primary" id="nextRoundBtn">Suivant →</button>
        </div>
    </div>

    <!-- ── WAITING FOR OTHERS ── -->
    <div class="overlay" id="waitingOthersOverlay" style="display:none">
        <div class="popup gs-waiting-small">
            <div class="gs-loading-spinner"></div>
            <p>En attente des autres joueurs…</p>
            <div id="submittedList" class="gs-submitted-list"></div>
        </div>
    </div>

    <!-- ── END SCREEN ── -->
    <div class="overlay" id="endScreen" style="display:none">
        <div class="popup gq-end-popup">
            <div class="gq-end-emoji" id="endEmoji">🏆</div>
            <h2 id="endTitle">Partie terminée !</h2>
            <div class="gq-end-score">
                <span id="endScore">0</span>
                <small>points</small>
            </div>
            <p id="endSubtitle" class="subtitle"></p>
            <div class="gq-end-stats" id="endStats"></div>
            <div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:8px">
                <button class="btn btn-primary" id="replayBtn">Rejouer</button>
                <a href="./index.html" class="btn btn-outline">Menu</a>
            </div>
        </div>
    </div>

    <script type="module" src="js/game.js"></script>
    <script type="module" src="../../js/countPlayedTime.js"></script>
</body>

</html>
